# ─────────────────────────────────────────────────────────────────
# Voxara CI Pipeline
# Runs on every push to main/develop and on pull requests.
# Mirrors the local `npm run precheck` script exactly.
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Minimal env vars needed for build (real secrets are NOT needed for type-checking)
  NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
  NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key-for-build'
  NEXT_PUBLIC_APP_URL: 'https://voxara.app'
  SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-role-key'
  NEXT_PUBLIC_SENTRY_DSN: ''

jobs:
  # ── Job 1: Fast checks (type-safe, no secrets needed) ───────────────────────
  static:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Edge Runtime safety (direct imports)
        run: npx ts-node --transpile-only scripts/check-edge-imports.ts

      - name: Check 'use client' placement
        run: npx ts-node --transpile-only scripts/precheck.ts --quick

      - name: TypeScript (strict noEmit)
        run: npx tsc --noEmit

      - name: ESLint
        run: npx next lint

  # ── Job 2: Full Next.js build ─────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          # Disable Sentry source map upload in CI (no auth token)
          SENTRY_AUTH_TOKEN: ''

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            .next/
            *.log
          retention-days: 3

  # ── Job 3: Supabase migration check ──────────────────────────────────────
  migrations:
    name: DB Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check migration sequence
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'supabase/migrations';
          const files = fs.readdirSync(dir).filter(f => /^\d+_.+\.sql$/.test(f)).sort();
          let prev = 0, gaps = [];
          for (const f of files) {
            const num = parseInt(f.split('_')[0]);
            if (num !== prev + 1) gaps.push('Gap at ' + num + ' (expected ' + (prev+1) + ')');
            prev = num;
          }
          if (gaps.length) { console.error(gaps.join('\n')); process.exit(1); }
          console.log('✓ ' + files.length + ' migrations sequential');
          "

      - name: Validate SQL syntax (basic)
        run: |
          for f in supabase/migrations/*.sql; do
            # Check for unclosed parentheses (basic syntax check)
            opens=$(grep -o '(' "$f" | wc -l)
            closes=$(grep -o ')' "$f" | wc -l)
            if [ "$opens" != "$closes" ]; then
              echo "✗ Unbalanced parentheses in $f (open: $opens, close: $closes)"
              exit 1
            fi
          done
          echo "✓ All SQL files have balanced parentheses"

  # ── Job 4: Security audit ─────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: npm audit (high+critical)
        run: npm audit --audit-level=high
        continue-on-error: true # Warn but don't block (transitive dep vulns)

      - name: Check for hardcoded secrets
        run: |
          # Simple grep for common secret patterns
          if grep -rn \
            -e 'sk_live_\|pk_live_\|AIza[A-Za-z0-9_-]\{35\}\|AKIA[0-9A-Z]\{16\}' \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --exclude-dir="node_modules" --exclude-dir=".next" \
            src/ 2>/dev/null | grep -v ".env\|test\|mock\|fake\|example"; then
            echo "✗ Potential hardcoded secrets found above"
            exit 1
          fi
          echo "✓ No obvious hardcoded secrets found"

      - name: Check no .env files committed
        run: |
          if git ls-files | grep -E '^\.env(\.[a-z]+)?$' | grep -v '.env.example'; then
            echo "✗ .env file(s) committed to repo — remove and rotate secrets"
            exit 1
          fi
          echo "✓ No .env files in repo"
