_format_version: "3.0"
_transform: true

services:
  - name: auth
    url: http://supabase-auth:9999/verify
    routes:
      - name: auth
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:3000", "http://localhost:54321"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "x-client-info", "apikey"]
          exposed_headers: ["Content-Range", "X-Content-Range"]
          credentials: true
          max_age: 3600

  - name: rest
    url: http://supabase-rest:3000/
    routes:
      - name: rest
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:3000", "http://localhost:54321"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "x-client-info", "apikey", "Prefer"]
          exposed_headers: ["Content-Range", "X-Content-Range"]
          credentials: true
          max_age: 3600

  - name: storage
    url: http://supabase-storage:5000/
    routes:
      - name: storage
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:3000", "http://localhost:54321"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "x-client-info", "apikey"]
          exposed_headers: []
          credentials: true
          max_age: 3600

  - name: realtime
    url: http://supabase-realtime:4000/
    routes:
      - name: realtime
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:3000", "http://localhost:54321"]
          methods: ["GET", "POST", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "x-client-info", "apikey"]
          exposed_headers: []
          credentials: true
          max_age: 3600